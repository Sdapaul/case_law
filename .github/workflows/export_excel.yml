name: 판례 Excel 내보내기

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '조회 시작일 (YYYY-MM-DD)'
        required: true
        default: '2025-01-01'
        type: string
      end_date:
        description: '조회 종료일 (YYYY-MM-DD)'
        required: true
        default: '2025-12-31'
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Excel 생성
        run: |
          python - <<'EOF'
          import sys
          from db import query_cases
          from excel_export import generate_excel

          start = "${{ github.event.inputs.start_date }}"
          end   = "${{ github.event.inputs.end_date }}"
          print(f"조회 기간: {start} ~ {end}")

          cases = query_cases(start, end)
          if not cases:
              print("해당 기간에 발송된 판례가 없습니다.")
              sys.exit(0)

          print(f"조회 결과: {len(cases)}건")
          data = generate_excel(cases, title=f"판례목록_{start}~{end}")
          fname = f"판례목록_{start}_{end}.xlsx"
          with open(fname, "wb") as f:
              f.write(data)
          print(f"파일 생성 완료: {fname}")
          EOF

      - name: Excel 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 판례목록_${{ github.event.inputs.start_date }}_${{ github.event.inputs.end_date }}
          path: 판례목록_${{ github.event.inputs.start_date }}_${{ github.event.inputs.end_date }}.xlsx
          retention-days: 30
          if-no-files-found: warn
